packages:
  - packages/*

# pnpm 11 blocks dependency build scripts by default and turns the block into a non-zero
# exit (ERR_PNPM_IGNORED_BUILDS), so every one of these must be listed or `pnpm install`
# fails in CI.
allowBuilds:
  # size-limit's bundle estimator.
  esbuild: true

# pnpm 11's supply-chain soak defaults to LOOSE: when it meets a package younger than the
# soak window it does not fail - it appends that package to `minimumReleaseAgeExclude`
# below and installs it anyway. The soak then excuses itself on every install and the
# exclusion list grows silently. Strict mode turns a too-young package into a hard
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION instead, so the only exclusions that exist are
# the ones written here on purpose. This tightens the control; it does not relax it.
minimumReleaseAgeStrict: true

# Deliberate, exact-version exclusions only. The soak keeps governing everything else.
minimumReleaseAgeExclude:
  # `tersify@4.0.6` is this sweep's own upstream release, published hours ago and picked
  # up here on purpose; `unpartial@1.0.7` is its runtime dependency, from the same
  # release. Both were auto-excluded by loose mode before the line above landed - kept,
  # pinned and explained, rather than left as unexplained residue.
  - tersify@4.0.6
  - unpartial@1.0.7
