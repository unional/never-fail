packages:
  - packages/*

# pnpm 11 blocks dependency build scripts by default and turns the block into a non-zero
# exit (ERR_PNPM_IGNORED_BUILDS), so every one of these must be listed or `pnpm install`
# fails in CI.
allowBuilds:
  # size-limit's bundle estimator.
  esbuild: true

# Supply-chain soak: no dependency may be installed until it is 24h old.
# `minimumReleaseAge` must be set here rather than in `.npmrc` - `minimumreleaseage`
# is not a valid npm key, so from `.npmrc` it never reaches pnpm's typed config and
# the soak is inert.
#
# pnpm 11's soak also defaults to LOOSE: when it meets a package younger than the
# window it does not fail - it appends that package to `minimumReleaseAgeExclude` and
# installs it anyway, so the soak excuses itself on every install and the exclusion
# list grows silently. Strict mode turns a too-young package into a hard
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION instead, so the only exclusions that exist
# are the ones written here on purpose.
#
# Strict mode with no window enforces nothing, so the two settings belong together.
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeStrict: true
